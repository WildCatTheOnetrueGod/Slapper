<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opacity Control Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
  /* 容器基本設定 */
#workspaceWeb {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  background-color: #fff;
}


</style>
  <!-- 控制滑桿區域 -->
 <div class="workspace-panel mode-panel-web" id="workspaceWeb">
  <!-- 功能列 -->
  <div class="web-toolbar">
    <select id="text-webSourceType" class="web-select">
      <option value="url" selected>輸入網址</option>
      <option value="file">上傳檔案</option>
    </select>

    <!-- 網址輸入框 -->
    <input 
      type="url" 
      id="text-webUrlInput" 
      class="web-input" 
      placeholder="請輸入網址 (例如: https://example.com)..."
    />

    <!-- 檔案上傳框 (預設隱藏) -->
    <input 
      type="file" 
      id="text-webFileInput" 
      class="web-input" 
      accept=".txt,.pdf" 
      style="display: none;"
    />

    <button type="button" id="text-webConfirmBtn" class="web-btn">確定</button>
  </div>

  <!-- 內容列 -->
  <div class="web-content" id="text-webContent">
    <div class="web-placeholder">請選擇來源並點擊「確定」載入內容</div>
  </div>
</div>

<!-- 引入獨立外部 JavaScript 檔案 -->
<script src="web-workspace.js"></script>


  <!-- 引入獨立外部 JavaScript 檔案 -->
  <script src="script.js"></script>
</body>
</html>
