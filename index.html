<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魚の鄉</title>
</head>
<body>
    <style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}
html,body {
	min-height: 100vh;  /* 電腦版與舊手機舊瀏覽器保底 */
	min-height: 100svh; /* (排除工具列後的最矮安全高度) */
	min-height: 100dvh; /* 現代手機動態適應 */
	width: 100dvw;
	overflow: hidden; /* 防止最外層出現瀏覽器滾軸 */
	display: flex;
	flex-direction: column;
	background: linear-gradient(to bottom, rgba(169, 225, 230, 0.9), rgba(94, 170, 233, 0.7));
	color: rgb(26, 49, 71);
}

::-webkit-scrollbar {/*捲軸背景*/
	height: 6px;
	width: 6px;
}
::-webkit-scrollbar-track {/*捲軸拉霸之外的空間*/
	background: transparent;
}
::-webkit-scrollbar-thumb {/*捲軸拉霸*/
	border-radius: 3px;
	background: rgba(26, 49, 71, 0.7);
}
.header {
	height: 40px;
	width: 100%;
	position: fixed;
	top: 0;
	left: 0;
	display: flex;
	align-items: center;
    justify-content: center;
	padding: 0 10px;
	overflow: hidden; /* 內容溢出直接裁切右邊 */
	white-space: nowrap;
	z-index: 1000;
	font-size: 22px;
	background: rgb(26, 49, 71);
	color: rgb(194, 232, 255);
	gap:5px;
}
.main-wrapper {
	margin-top: 40px;
	min-height: calc(100vh - 40px);
	min-height: calc(100svh - 40px);
	min-height: calc(100dvh - 40px);
	/* 內部的子元素計算高度百分比 */
	height: calc(100dvh - 40px);
	width: 100dvw;
}
.mnu{
    position: static !important;
    margin: 0 !important;
    float: none !important;
    min-height: auto;
    overflow-y: scroll;
    width: 200px;
    display: flex;
	flex-direction: column;
    align-items: center;
    background: rgb(204 241 255 / 32%);
    gap: 5px;
    border-radius: 5px;
}
.title{
    height: 40px;
    display: flex;
    justify-content: center; 
    align-items: center;
    font-weight: bold;
}
.btn{
    width: 90%;
    padding: 10px; 
    background: linear-gradient(to bottom, rgb(151 187 201 / 74%), #60ccffbd);
    cursor: pointer;
    border-radius: 4px;
}
.btn h3{
  color: rgb(26, 49, 71);
}
.btn p{
  color: rgb(71, 71, 71);
  font-size: 15px;
}
.btn:hover{
    background: linear-gradient(to bottom, rgba(165, 165, 165, 0.932), #6e93acc5); 
    cursor: pointer;
    transition: all 0.3s;   /* 舉例：加上平滑過渡效果 */
}
.btn:hover h3{
  color: rgb(44, 109, 170);
}
.btn:hover p{
  color: rgb(99, 96, 96);
  
}
    </style>
    <div class="header">࣪ ˖🌊⋆｡°.🐚⋆˖🐠°⋆🫧✧.🪸𓇼.˖࣪  </div>
    <div class="main-wrapper">
        <div style="width: 100%; height: 100%; padding: 5px; gap: 5px; display: flex !important;flex-direction: row !important;box-sizing: border-box;">
            <div class="mnu">
                <div class = "title">💠偽裝者們💠</div>
                    <div class="btn" onclick="window.open('https://wildcattheonetruegod.github.io/Slapper/html/01.html', '_blank');">
                        <h3>假裝成VScode摸魚</h3>
                        <p>含有四種摸魚模式</p>
                    </div>
                    <div class="btn" onclick="window.open('https://wildcattheonetruegod.github.io/Slapper/html/02.html', '_blank');">
                        <h3>假裝成看文件摸魚</h3>
                        <p>含有四種摸魚模式</p>
                    </div>
            </div>
            <div class="mnu">
                <div class = "title">💠光明正大💠</div>
                    <div class="btn" onclick="window.open('https://kreska.art/app/', '_blank');">
                        <h3>kreska，神奇的線上畫畫網站</h3>
                        <p>用點高級的不要用我的</p>
                    </div>
                    <div class="btn" onclick="window.open('https://wildcattheonetruegod.github.io/Slapper/html/markdown.html', '_blank');">
                        <h3>馬克當編輯器</h3>
                        <p>Markdown阿!是Markdown!</p>
                        <p>也可以當txt編輯器用(吧)</p>
                    </div>
            </div>
        
        
        </div>
    </div>
</body>
</html>
